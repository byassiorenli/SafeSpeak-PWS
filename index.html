<script>

// ===================================================
// STATE
// ===================================================
let CONST = {};
let huidigGebruiker = null; // { user, role, voornaam, achternaam, leerjaar, niveau, klas, klassen }
let terugScherm = null;


// leerling
let vState = { step:1, antwoorden:[], docentUsername:'', docentNaam:'' };


// moderator
let modData = []; let modActiefTab = 'pending'; let modGeselecteerd = null; let modSubView = 'normaal'; let modReden = null;
let klasVerzoekenData = [];
let docentKlassen = []; // tijdelijk voor aanmaakformulier


// docent
let docCharts = { trend:null, radar:null };


const REDENEN = {
 'ongepast':      { tekst:'Ongepast',               icoon:'🚫' },
 'agressief':     { tekst:'Agressief',               icoon:'💢' },
 'scheldwoorden': { tekst:'Scheldwoorden',           icoon:'🤬' },
 'racistisch':    { tekst:'Racistisch',              icoon:'✊' },
 'persoonlijk':   { tekst:'Persoonlijk aanvallend',  icoon:'👤' },
 'niet-relevant': { tekst:'Niet relevant',           icoon:'❓' }
};


// ===================================================
// HULPFUNCTIES
// ===================================================
function toonToast(msg, fout=false) {
 const t = document.getElementById('toast');
 t.textContent = msg; t.className = fout ? 'fout' : '';
 t.classList.add('zichtbaar');
 setTimeout(() => t.classList.remove('zichtbaar'), 3200);
}


function verbergAlles() {
 ['screen-login','screen-leerling','screen-moderator','screen-docent','screen-instellingen','screen-docent-aanmaken']
   .forEach(id => { const el=document.getElementById(id); if(el){el.style.display='none';el.classList.remove('screen');} });
 document.getElementById('settings-fab').style.display = 'none';
}


function toonScherm(id) {
 verbergAlles();
 const el = document.getElementById(id);
 el.style.display = id === 'screen-login' ? 'flex' : 'block';
 // De settings-FAB verschijnt op alle schermen, BEHALVE login en instellingen zelf
 if (id !== 'screen-login' && id !== 'screen-instellingen') {
   const fab = document.getElementById('settings-fab');
   fab.style.display = 'flex';
 }
}


function vulSel(id, items) {
 const el = document.getElementById(id);
 el.innerHTML = '<option value="">-- Kies --</option>';
 items.forEach(i => el.innerHTML += `<option value="${i}">${i}</option>`);
}


function setLoginAlert(msg, ok=false) {
 const el = document.getElementById('login-alert');
 if (!msg) { el.innerHTML=''; return; }
 el.innerHTML = `<div class="${ok?'alert-ok':'alert-err'}">${msg}</div>`;
}


// ===================================================
// INLOGGEN
// ===================================================
function setRol(rol, btn) {
 document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
 btn.classList.add('active');
 const lbl = document.getElementById('lbl-user');
 const regLink = document.getElementById('btn-reg-link');
 if (rol === 'leerling') { lbl.textContent='Leerlingnummer'; regLink.style.display='block'; }
 else { lbl.textContent='Gebruikersnaam'; regLink.style.display='none'; }
 setLoginAlert('');
}


function getActiefRol() {
 const actief = document.querySelector('.role-tab.active');
 const map = { 'Leerling':'leerling', 'Moderator':'moderator', 'Docent':'docent' };
 return map[actief ? actief.textContent.trim() : 'Leerling'] || 'leerling';
}


function doLogin() {
 const u = document.getElementById('inp-user').value.trim();
 const p = document.getElementById('inp-pass').value;
 if (!u||!p) return setLoginAlert('⚠️ Vul alle velden in.');
 const rol = getActiefRol();
 const btn = document.getElementById('btn-inloggen');
 btn.disabled = true;
 btn.textContent = 'Inloggen...';
 setLoginAlert('');
 google.script.run
   .withSuccessHandler(res => {
     btn.disabled = false; btn.textContent = 'Inloggen';
     if (res.success) {
       huidigGebruiker = res;
       try {
         if (rol==='leerling') startLeerling();
         else if (rol==='moderator') startModerator();
         else if (rol==='docent') startDocent();
       } catch(e) {
         setLoginAlert('⚠️ Er ging iets mis bij het laden van het scherm: '+e.message);
       }
     } else {
       setLoginAlert(res.error);
     }
   })
   .withFailureHandler(err => {
     btn.disabled = false; btn.textContent = 'Inloggen';
     setLoginAlert('⚠️ '+err.message);
   })
   .checkLogin(u, p, rol);
}


function doLogout() {
 huidigGebruiker = null; modData = [];
 document.getElementById('cookie-banner').classList.remove('zichtbaar');
 toonScherm('screen-login');
 document.getElementById('inp-user').value='';
 document.getElementById('inp-pass').value='';
 setLoginAlert('');
 toonInlog();
}


// ===================================================
// REGISTRATIE
// ===================================================
function toonRegistratie() {
 document.getElementById('lf-in').style.display='none';
 document.getElementById('lf-reg1').style.display='block';
 document.getElementById('lf-reg2').style.display='none';
 setLoginAlert('');
 document.querySelector('.login-card').classList.add('reg-mode');
 google.script.run.withSuccessHandler(res => {
   CONST=res;
   vulSel('reg-jaar',CONST.LEERJAAR_OPTIES);
 }).getConstants();
}
function toonInlog() {
 document.getElementById('lf-in').style.display='block';
 document.getElementById('lf-reg1').style.display='none';
 document.getElementById('lf-reg2').style.display='none';
 setLoginAlert('');
 document.querySelector('.login-card').classList.remove('reg-mode');
}
function toonReg1() {
 document.getElementById('lf-reg1').style.display='block';
 document.getElementById('lf-reg2').style.display='none';
}


function regStap1() {
 const vn=document.getElementById('reg-vn').value.trim();
 const an=document.getElementById('reg-an').value.trim();
 const nr=document.getElementById('reg-nr').value.trim();
 const pw=document.getElementById('reg-pw').value;
 const pw2=document.getElementById('reg-pw2').value;
 const err = document.getElementById('reg1-err');
 if (!vn||!an||!nr||!pw||!pw2){err.innerHTML='<div class="alert-err">⚠️ Vul alle velden in!</div>';return;}
 if (!/^\d{6}$/.test(nr)){err.innerHTML='<div class="alert-err">⚠️ Leerlingnummer moet uit exact 6 cijfers bestaan!</div>';return;}
 if (pw!==pw2){err.innerHTML='<div class="alert-err">⚠️ Wachtwoorden komen niet overeen!</div>';return;}
 err.innerHTML='';
 document.getElementById('lf-reg1').style.display='none';
 document.getElementById('lf-reg2').style.display='block';
 vulSel('reg-jaar',CONST.LEERJAAR_OPTIES);
}


function regUpdateNiveau() {
 const j=document.getElementById('reg-jaar').value;
 if(j&&CONST.NIVEAU_MAP&&CONST.NIVEAU_MAP[j]){
   vulSel('reg-niv',CONST.NIVEAU_MAP[j]);
   document.getElementById('reg-wrap-niv').style.display='block';
   document.getElementById('reg-wrap-klas').style.display='none';
 } else document.getElementById('reg-wrap-niv').style.display='none';
}
function regUpdateKlas() {
 const j=document.getElementById('reg-jaar').value, n=document.getElementById('reg-niv').value;
 if(n&&CONST.KLAS_GENERATOR&&CONST.KLAS_GENERATOR[j]&&CONST.KLAS_GENERATOR[j][n]){
   vulSel('reg-klas',CONST.KLAS_GENERATOR[j][n]);
   document.getElementById('reg-wrap-klas').style.display='block';
 } else document.getElementById('reg-wrap-klas').style.display='none';
}


function regStap2() {
 const vn=document.getElementById('reg-vn').value.trim();
 const an=document.getElementById('reg-an').value.trim();
 const nr=document.getElementById('reg-nr').value.trim();
 const pw=document.getElementById('reg-pw').value;
 const pw2=document.getElementById('reg-pw2').value;
 const j=document.getElementById('reg-jaar').value;
 const n=document.getElementById('reg-niv').value;
 const k=document.getElementById('reg-klas').value;
 const err=document.getElementById('reg2-err');
 if (!j||!n||!k){err.innerHTML='<div class="alert-err">⚠️ Kies je leerjaar, niveau en klas!</div>';return;}
 err.innerHTML='';
 const btn=document.getElementById('btn-account-aanmaken');
 btn.disabled=true; btn.innerHTML='<span class="btn-spinner"></span> Account aanmaken...';
 google.script.run
   .withSuccessHandler(res => {
     btn.disabled=false; btn.textContent='Account aanmaken';
     if (res.success) {
       toonToast('✅ Account aangemaakt! Je kunt nu inloggen.');
       setTimeout(()=>{
         document.getElementById('inp-user').value=nr;
         toonInlog();
       }, 2500);
     } else err.innerHTML=`<div class="alert-err">${res.error}</div>`;
   })
   .withFailureHandler(err2=>{
     btn.disabled=false; btn.textContent='Account aanmaken';
     err.innerHTML=`<div class="alert-err">⚠️ ${err2.message}</div>`;
   })
   .registerLeerling(vn,an,nr,pw,pw2,j,n,k);
}


// ===================================================
// LEERLING
// ===================================================
function startLeerling() {
 toonScherm('screen-leerling');
 terugScherm='screen-leerling';
 const u=huidigGebruiker;
 const ondertitel=document.getElementById('ll-ondertitel');
 const klasLbl=document.getElementById('ll-klas-lbl');
 if (ondertitel) ondertitel.textContent=`Welkom, ${u.voornaam}!`;
 if (klasLbl) klasLbl.textContent=`Klas: ${u.klas||'onbekend'}`;
 if (!CONST.LEERJAAR_OPTIES) {
   google.script.run.withSuccessHandler(res=>{ CONST=res; laadDocenten(); }).getConstants();
 } else laadDocenten();
 herlaadFeedback();
 toonCookieBannerIndienNodig();
}


function laadDocenten() {
 const klas = huidigGebruiker.klas;
 if (!klas) return;
 const sel = document.getElementById('sel-docent');
 sel.innerHTML = '<option value="">⏳ Docenten laden...</option>';
 google.script.run.withSuccessHandler(lijst => {
   sel.innerHTML = '<option value="">-- Kies een docent --</option>';
   if (!lijst||!lijst.length) {
     sel.innerHTML += '<option disabled>Geen docenten gevonden voor jouw klas</option>';
     return;
   }
   lijst.forEach(d => sel.innerHTML += `<option value="${d.username}" data-naam="${d.naam}">${d.naam}</option>`);
 }).getDocentenVoorKlas(klas);
}


function herlaadFeedback() {
 document.getElementById('ll-history').innerHTML='<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-tekst">Feedback laden...</div></div>';
 schakelLeerling('lv-dash');
 google.script.run.withSuccessHandler(res=>{
   if(res.success) toonFeedbackLijst(res.data);
 }).getMyFeedback(huidigGebruiker.user);
}


let llFeedbackData = [];

function toonFeedbackLijst(data) {
 llFeedbackData = data || [];
 const div=document.getElementById('ll-history');
 if(!data||!data.length){
   div.innerHTML=`<div style="background:#f8fafc;border:2px dashed var(--rand);border-radius:12px;padding:22px;text-align:center;color:var(--slate2);font-size:13px;">Je hebt nog geen feedback ingediend.</div>`;
   return;
 }
 div.innerHTML=[...data].reverse().map(item=>{
   const statusMap={
     pending:`<span class="fb-status fb-bezig">Bezig</span>`,
     approved:`<span class="fb-status fb-door">Doorgestuurd</span>`,
     rejected:`<span class="fb-status fb-af">Afgewezen</span>`
   };
   const datum=item.datum?item.datum.substring(0,10):'';
   const gem=((parseFloat(item.q1)||0)+(parseFloat(item.q2)||0)+(parseFloat(item.q3)||0))/3;
   return `<div class="feedback-item" style="cursor:pointer;" onclick="toonFeedbackDetail('${item.id}')">
     <div><b style="color:var(--groen);font-size:.9em;">${item.docent}</b> <span style="color:var(--slate2);font-size:.8em;">— ${item.klas}</span>
     <div style="font-size:.75em;color:var(--slate3);">${datum}</div></div>
     <div style="display:flex;align-items:center;gap:8px;">
       <span style="background:var(--groen);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;">${gem.toFixed(1)}/5</span>
       ${statusMap[item.status]||statusMap.pending}
       <i class="fas fa-chevron-right" style="color:var(--slate3);font-size:.8em;"></i>
     </div>
   </div>`;
 }).join('');
}

function toonFeedbackDetail(id){
 const item = llFeedbackData.find(f=>f.id===id);
 if(!item) return;
 const statusMap={
   pending:{tekst:'Bezig — nog niet beoordeeld door moderator',klasse:'fb-bezig'},
   approved:{tekst:'Doorgestuurd naar de docent',klasse:'fb-door'},
   rejected:{tekst:'Afgewezen door de moderator',klasse:'fb-af'}
 };
 const s=statusMap[item.status]||statusMap.pending;
 const datum=item.datum?fmtDatum(item.datum):'';
 let redenHtml='';
 if(item.status==='rejected' && item.afwijsReden){
   const redenInfo=REDENEN[item.afwijsReden];
   const redenTekst=redenInfo?(redenInfo.icoon+' '+redenInfo.tekst):item.afwijsReden;
   redenHtml=`<div style="background:var(--rood-bg);border:1px solid #fecaca;border-radius:10px;padding:10px 13px;margin-top:10px;font-size:.83em;color:var(--rood);"><b>Reden van afwijzing:</b> ${redenTekst}</div>`;
 }
 document.getElementById('fb-detail-inhoud').innerHTML=`
   <div class="detail-kaart">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
       <div><b style="color:var(--groen);">${item.docent}</b><div style="font-size:.78em;color:var(--slate2);">${item.klas} — ${datum}</div></div>
       <span class="fb-status ${s.klasse}">${s.tekst}</span>
     </div>
     ${redenHtml}
     <div style="display:flex;gap:10px;margin:14px 0;">
       <div style="flex:1;text-align:center;background:#f8fafc;border-radius:10px;padding:10px;">
         <div style="font-size:.7em;color:var(--slate2);">Uitleg</div><div style="font-weight:700;color:var(--groen);font-size:1.2em;">${item.q1}</div>
       </div>
       <div style="flex:1;text-align:center;background:#f8fafc;border-radius:10px;padding:10px;">
         <div style="font-size:.7em;color:var(--slate2);">Uitdaging</div><div style="font-weight:700;color:var(--groen);font-size:1.2em;">${item.q2}</div>
       </div>
       <div style="flex:1;text-align:center;background:#f8fafc;border-radius:10px;padding:10px;">
         <div style="font-size:.7em;color:var(--slate2);">Hulp</div><div style="font-weight:700;color:var(--groen);font-size:1.2em;">${item.q3}</div>
       </div>
     </div>
     <div style="font-size:.78em;color:var(--slate2);margin-bottom:5px;">Jouw toelichting:</div>
     <div style="background:#f8fafc;border-radius:10px;padding:12px;font-size:.88em;color:#222;line-height:1.5;">${item.toelichting?item.toelichting:'<i style="color:var(--slate3);">Geen toelichting gegeven.</i>'}</div>
   </div>
   <button class="actie-btn" style="background:#fee2e2;color:#991b1b;" onclick="vraagVerwijderBevestiging('${item.id}')"><i class="fas fa-trash" style="margin-right:6px;"></i>Verwijder deze feedback</button>
   <div id="fb-verwijder-waarschuwing"></div>
 `;
 document.getElementById('fb-detail-res').innerHTML='';
 schakelLeerling('lv-fb-detail');
}

function vraagVerwijderBevestiging(id){
 document.getElementById('fb-verwijder-waarschuwing').innerHTML = `
   <div class="warn-box" style="margin-top:14px;">
     <b>⚠️ Weet je het zeker?</b><br>
     Deze actie kan niet ongedaan worden gemaakt. De feedback wordt permanent verwijderd, ook uit het overzicht van de moderator en — als deze al was doorgestuurd — uit het overzicht van de docent.
   </div>
   <div style="display:flex;gap:10px;margin-top:10px;">
     <button class="actie-btn" style="background:#dc2626;color:#fff;margin-bottom:0;" onclick="verwijderEenFeedback('${id}')">Ja, definitief verwijderen</button>
     <button class="actie-btn" style="background:var(--rand);color:#333;margin-bottom:0;" onclick="document.getElementById('fb-verwijder-waarschuwing').innerHTML=''">Annuleren</button>
   </div>
 `;
}

function verwijderEenFeedback(id){
 const res=document.getElementById('fb-detail-res');
 google.script.run
   .withSuccessHandler(r=>{
     if(r.success){
       toonToast('✅ Feedback verwijderd.');
       herlaadFeedback();
     } else {
       res.innerHTML=`<div class="alert-err">⚠️ ${r.error}</div>`;
     }
   })
   .withFailureHandler(err=>{ res.innerHTML=`<div class="alert-err">⚠️ ${err.message}</div>`; })
   .deleteSingleFeedback(id, huidigGebruiker.user);
}


function schakelLeerling(id) {
 document.querySelectorAll('.lview').forEach(v=>v.classList.remove('actief'));
 document.getElementById(id).classList.add('actief');
}


function startVragen() {
 const sel=document.getElementById('sel-docent');
 vState.docentUsername=sel.value;
 const opt=sel.options[sel.selectedIndex];
 vState.docentNaam=opt?opt.dataset.naam||opt.textContent:'';
 if(!vState.docentUsername) return toonToast('⚠️ Kies eerst een docent!',true);
 vState.step=1; vState.antwoorden=[];
 document.getElementById('v-score').value=3;
 document.getElementById('v-toel-wrap').style.display='none';
 document.getElementById('v-toel').value='';
 toonVraag();
 schakelLeerling('lv-vragen');
}

function verlaatVragen(){
 if(vState.step>1 || vState.antwoorden.length>0){
   if(!confirm('Je bent halverwege een feedbackformulier. Als je teruggaat, gaan je antwoorden verloren. Wil je doorgaan?')) return;
 }
 schakelLeerling('lv-docent');
}


function updateSlider() {
 const v=parseInt(document.getElementById('v-score').value);
 const m={1:['#ef4444','Zeer onvoldoende'],2:['#f97316','Onvoldoende'],3:['#eab308','Voldoende'],4:['#4ade80','Goed'],5:['#166534','Uitstekend']};
 const[c,t]=m[v];
 document.getElementById('v-slider-lbl').innerHTML=`<span style="background:${c};color:#fff;padding:5px 15px;border-radius:20px;font-weight:700;font-size:13px;">Score: ${v} — ${t}</span>`;
}


function toonVraag() {
 const q=CONST.QUESTIONS[vState.step-1];
 document.getElementById('v-vraag').textContent=q;
 const pct=Math.round((vState.step/3)*100);
 document.getElementById('v-prog-txt').textContent=`Vraag ${vState.step} van 3 | ${pct}%`;
 document.getElementById('v-prog-balk').style.width=pct+'%';
 document.getElementById('v-btn-volgende').textContent=vState.step===3?'Verzenden':'Volgende';
 document.getElementById('v-toel-wrap').style.display=vState.step===3?'block':'none';
 updateSlider();
}


function volgendeVraag() {
 vState.antwoorden.push(document.getElementById('v-score').value);
 if (vState.step<3){ vState.step++; document.getElementById('v-score').value=3; toonVraag(); return; }
 const payload={
   username:huidigGebruiker.user, leerjaar:huidigGebruiker.leerjaar,
   niveau:huidigGebruiker.niveau, klas:huidigGebruiker.klas,
   voornaam:huidigGebruiker.voornaam||'', achternaam:huidigGebruiker.achternaam||'',
   docentUsername:vState.docentUsername, docentNaam:vState.docentNaam,
   q1:vState.antwoorden[0], q2:vState.antwoorden[1], q3:vState.antwoorden[2],
   toelichting:document.getElementById('v-toel').value
 };
 const btn=document.getElementById('v-btn-volgende');
 btn.disabled=true; btn.innerHTML='<span class="btn-spinner"></span> Versturen...';
 google.script.run
   .withSuccessHandler(res=>{
     btn.disabled=false;
     if(res.success){
       document.getElementById('v-succes-msg').textContent=`Bedankt! Je beoordeling voor ${vState.docentNaam} is anoniem verwerkt.`;
       schakelLeerling('lv-succes');
     } else { toonToast('Fout: '+res.error,true); btn.textContent='Verzenden'; }
   })
   .withFailureHandler(err=>{ btn.disabled=false; btn.textContent='Verzenden'; toonToast('Fout: '+err.message,true); })
   .saveFeedback(payload);
}


// ===================================================
// MODERATOR
// ===================================================
function startModerator() {
 toonScherm('screen-moderator');
 terugScherm='screen-moderator';
 laadModData();
 google.script.run.withSuccessHandler(lijst=>{ klasVerzoekenData=lijst||[]; updateKvBadge(); }).getKlasVerzoeken();
 toonCookieBannerIndienNodig();
}


function laadModData() {
 document.getElementById('mod-inbox').innerHTML='<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-tekst">Feedback laden...</div></div>';
 google.script.run
   .withSuccessHandler(raw=>{
     try{
       modData=JSON.parse(raw);
       renderModInbox();
       renderModDetail(null);
       updateWachtendBadge();
     }
     catch(e){ document.getElementById('mod-inbox').innerHTML='<div style="color:red;padding:10px;">Fout: '+e.message+'</div>'; }
   })
   .withFailureHandler(err=>{ document.getElementById('mod-inbox').innerHTML='<div style="color:red;padding:10px;">⚠️ '+err.message+'</div>'; })
   .getFeedbackData();
}

function updateWachtendBadge(){
 const badge=document.getElementById('wachtend-badge');
 if(!badge) return;
 const n=modData.filter(i=>i.status==='pending').length;
 badge.textContent=n;
 badge.style.display=n>0?'inline-block':'none';
}


function modTabSwitch(btn) {
 document.querySelectorAll('.mod-tab').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 modActiefTab=btn.dataset.tab;
 modGeselecteerd=null;
 renderModInbox();
 renderModDetail(null);
}
function modGaDocentAanmaken(){
 docentKlassen=[];
 verbergAlles();

function verwerkMod(id,actie,reden=null,onthul=false){
 google.script.run
   .withSuccessHandler(()=>{
     const idx=modData.findIndex(f=>f.id===id);
     if(idx!==-1){
       modData[idx].status=actie==='approve'?'approved':'rejected';
       if(reden) modData[idx].rejectionReason=reden;
       modData[idx].identityRevealed=onthul;
       renderModInbox(); renderModDetail(modData[idx]);
       updateWachtendBadge();
     }
   })
   .withFailureHandler(err=>toonToast('Fout: '+err.message,true))
   .updateFeedbackStatus(id,actie,reden,onthul);
}

function fmtDatum(s){
 if(!s) return '';
 const d=new Date(s); if(isNaN(d.getTime())) return s;
 return d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}

function laadDocData(){
 document.getElementById('doc-comments').innerHTML='<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-tekst">Feedback laden...</div></div>';
 document.getElementById('doc-tabel').innerHTML='<tr><td colspan="6"><div class="spinner-wrap" style="padding:20px;"><div class="spinner" style="width:24px;height:24px;"></div></div></td></tr>';
 google.script.run
   .withSuccessHandler(res=>{
     if(!res.success){document.getElementById('doc-comments').innerHTML='<div class="geen-data">'+res.error+'</div>';return;}
     const data=res.data;
     const vakInfo=document.getElementById('doc-vak-info');
     if(vakInfo) vakInfo.textContent = res.vak ? ('Vak: '+res.vak) : '';
     if(!data.length){
       document.getElementById('doc-comments').innerHTML='<div class="geen-data">Nog geen goedgekeurde feedback ontvangen.</div>';
       document.getElementById('doc-tabel').innerHTML='<tr><td colspan="6" class="geen-data">Nog geen data.</td></tr>';
       return;
     }
     const c=data.length;
     const a1=(data.reduce((s,d)=>s+(d.q1||0),0)/c).toFixed(1);
     const a2=(data.reduce((s,d)=>s+(d.q2||0),0)/c).toFixed(1);
     const a3=(data.reduce((s,d)=>s+(d.q3||0),0)/c).toFixed(1);
     document.getElementById('avg-q1').textContent=a1;
     document.getElementById('avg-q2').textContent=a2;
     document.getElementById('avg-q3').textContent=a3;
     document.getElementById('avg-total').textContent=c;
     const comments=document.getElementById('doc-comments');
     const tbl=document.getElementById('doc-tabel');
     comments.innerHTML='';
     [...data].reverse().forEach(item=>{
       if(item.note) comments.innerHTML+=`<div class="comment-kaart"><div class="comment-tekst">"${item.note}"</div><div class="comment-scores"><span>📖 ${item.q1}</span><span>🎯 ${item.q2}</span><span>💡 ${item.q3}</span></div><div style="font-size:.65rem;color:gray;margin-top:5px;">${item.klas}</div></div>`;
     });

     // Groepeer per klas voor het klas- en vakoverzicht
     const perKlas={};
     data.forEach(item=>{
       const k=item.klas||'Onbekend';
       if(!perKlas[k]) perKlas[k]={n:0,q1:0,q2:0,q3:0};
       perKlas[k].n++; perKlas[k].q1+=item.q1; perKlas[k].q2+=item.q2; perKlas[k].q3+=item.q3;
     });
     tbl.innerHTML='';
     Object.keys(perKlas).sort().forEach(k=>{
       const g=perKlas[k];
       tbl.innerHTML+=`<tr><td><b>${k}</b></td><td>${res.vak||'—'}</td><td>${g.n}</td><td>${(g.q1/g.n).toFixed(1)}</td><td>${(g.q2/g.n).toFixed(1)}</td><td>${(g.q3/g.n).toFixed(1)}</td></tr>`;
     });

     updateDocCharts(data,a1,a2,a3);
   })
   .withFailureHandler(err=>{document.getElementById('doc-comments').innerHTML='<div class="geen-data">⚠️ '+err.message+'</div>';})
   .getApprovedFeedbackForDocent(huidigGebruiker.user);
}


function initDocCharts(){
 // Chart.js komt van een extern CDN-script. Als dat (nog) niet geladen is, mag de rest van
 // het docentenscherm gewoon doorgaan — anders crasht startDocent() en blijft de inlogknop hangen.
 if (typeof Chart === 'undefined') {
   console.warn('Chart.js is niet geladen — grafieken worden overgeslagen.');
   return;
 }
 try {
   if(docCharts.trend){docCharts.trend.destroy();docCharts.radar.destroy();}
   const trendEl = document.getElementById('trendChart');
   const radarEl = document.getElementById('radarChart');
   if (!trendEl || !radarEl) return;
   docCharts.trend=new Chart(trendEl.getContext('2d'),{
     type:'line',
     data:{labels:[],datasets:[
       {label:'Uitleg 📖',borderColor:'#14532d',backgroundColor:'transparent',data:[],tension:.3},
       {label:'Uitdaging 🎯',borderColor:'#059669',backgroundColor:'transparent',data:[],tension:.3},
       {label:'Hulp 💡',borderColor:'#6ee7b7',backgroundColor:'transparent',data:[],tension:.3}
     ]},
     options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:5}}}
   });
   docCharts.radar=new Chart(radarEl.getContext('2d'),{
     type:'radar',
     data:{labels:['Uitleg 📖','Uitdaging 🎯','Hulp 💡'],
       datasets:[{label:'Gemiddelde',data:[0,0,0],backgroundColor:'rgba(20,83,45,.1)',borderColor:'var(--groen)'}]},
     options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:5}}}
   });
 } catch(e) {
   console.warn('Grafieken laden mislukt:', e.message);
 }
}
function updateDocCharts(data,a1,a2,a3){
 if (!docCharts.trend || !docCharts.radar) return; // grafieken niet beschikbaar, sla bijwerken over
 docCharts.trend.data.labels=data.map((_,i)=>'#'+(i+1));
 docCharts.trend.data.datasets[0].data=data.map(d=>d.q1);
 docCharts.trend.data.datasets[1].data=data.map(d=>d.q2);
 docCharts.trend.data.datasets[2].data=data.map(d=>d.q3);
 docCharts.trend.update();
 docCharts.radar.data.datasets[0].data=[parseFloat(a1),parseFloat(a2),parseFloat(a3)];
 docCharts.radar.update();
}

 document.getElementById('inst-blok-klas').style.display=isLeerling?'block':'none';


 checkKlasVerzoekStatus();
 if(isLeerling && !CONST.LEERJAAR_OPTIES){
   google.script.run.withSuccessHandler(res=>{CONST=res;vulInstKlasDropdowns();}).getConstants();
 } else if(isLeerling) vulInstKlasDropdowns();


 updateCookieUI();
}


function vulInstKlasDropdowns(){
 vulSel('inst-jaar',CONST.LEERJAAR_OPTIES);
 if(huidigGebruiker.leerjaar){
   document.getElementById('inst-jaar').value=huidigGebruiker.leerjaar;
   instUpdateNiveau(true);
 }
}
function instUpdateNiveau(preselect=false){
 const j=document.getElementById('inst-jaar').value;
 if(j&&CONST.NIVEAU_MAP&&CONST.NIVEAU_MAP[j]){
   vulSel('inst-niv',CONST.NIVEAU_MAP[j]);
   document.getElementById('inst-wrap-niv').style.display='block';
   if(preselect&&huidigGebruiker.niveau){
     document.getElementById('inst-niv').value=huidigGebruiker.niveau;
     instUpdateKlas(true);
   } else {
     document.getElementById('inst-wrap-klas').style.display='none';
   }
 } else document.getElementById('inst-wrap-niv').style.display='none';
}
function instUpdateKlas(preselect=false){
 const j=document.getElementById('inst-jaar').value, n=document.getElementById('inst-niv').value;
 if(n&&CONST.KLAS_GENERATOR&&CONST.KLAS_GENERATOR[j]&&CONST.KLAS_GENERATOR[j][n]){
   vulSel('inst-klas',CONST.KLAS_GENERATOR[j][n]);
   document.getElementById('inst-wrap-klas').style.display='block';
   if(preselect&&huidigGebruiker.klas) document.getElementById('inst-klas').value=huidigGebruiker.klas;
 } else document.getElementById('inst-wrap-klas').style.display='none';
}


function slaKlasOp(){
 const j=document.getElementById('inst-jaar').value;
 const n=document.getElementById('inst-niv').value;
 const k=document.getElementById('inst-klas').value;
 const res=document.getElementById('klas-res');
 if(!j||!n||!k){res.className='inst-res alert-err';res.textContent='⚠️ Vul alle velden in!';res.style.display='block';return;}
 google.script.run
   .withSuccessHandler(r=>{
     if(r.success){
       if(r.pending){
         res.className='inst-res alert-ok';
         res.textContent='✅ Je verzoek is verzonden! Een moderator moet dit eerst goedkeuren voordat je klas wijzigt.';
         res.style.display='block';
         checkKlasVerzoekStatus();
       } else {
         huidigGebruiker.leerjaar=j; huidigGebruiker.niveau=n; huidigGebruiker.klas=k;
         res.className='inst-res alert-ok';res.textContent='✅ Klas bijgewerkt!';res.style.display='block';
       }
     } else {res.className='inst-res alert-err';res.textContent=r.error;res.style.display='block';}
   })
   .updateLeerlingKlas(huidigGebruiker.user,j,n,k);
}

function checkKlasVerzoekStatus(){
 if(!huidigGebruiker || huidigGebruiker.role!=='leerling') return;
 google.script.run.withSuccessHandler(r=>{
   const el=document.getElementById('klas-verzoek-status');
   if(!el) return;
   if(r.success && r.verzoek){
     el.innerHTML=`<div class="warn-box" style="margin-top:10px;">⏳ Je hebt een openstaand verzoek om naar <b>${r.verzoek.nieuweKlas}</b> te wisselen. Dit wacht op goedkeuring van een moderator.</div>`;
   } else {
     el.innerHTML='';
   }
 }).getMijnKlasVerzoek(huidigGebruiker.user);
}


function terugnaarScherm(){
 if(!terugScherm||terugScherm==='screen-login') toonScherm('screen-login');
 else toonScherm(terugScherm);
}


function verwijderData(){
 const res=document.getElementById('del-res');
 if(!huidigGebruiker||huidigGebruiker.role!=='leerling'){
   res.className='inst-res alert-err';res.textContent='Alleen leerlingen kunnen dit doen.';res.style.display='block';return;
 }
 if(!confirm('Weet je zeker dat je al je feedbackberichten wilt verwijderen?')) return;
 google.script.run
   .withSuccessHandler(r=>{
     res.className='inst-res '+(r.success?'alert-ok':'alert-err');
     res.textContent=r.success?`✅ ${r.deleted} bericht(en) verwijderd.`:'⚠️ '+r.error;
     res.style.display='block';
   })
   .withFailureHandler(err=>{res.className='inst-res alert-err';res.textContent='⚠️ '+err.message;res.style.display='block';})
   .deleteMyData(huidigGebruiker.user);
}


// ── Cookievoorkeur: volledig backend-opgeslagen (per account), niet via localStorage.
// huidigGebruiker.cookieKeuze komt al mee in de loginrespons ("" = nog geen keuze, "true"/"false" = keuze).

function updateCookieUI(){
 const keuze = huidigGebruiker ? huidigGebruiker.cookieKeuze : "";
 const status = document.getElementById('cookie-status');
 const btnJa  = document.getElementById('cookie-btn-ja');
 const btnNee = document.getElementById('cookie-btn-nee');
 if(!status || !btnJa || !btnNee) return;
 btnJa.classList.remove('gekozen'); btnNee.classList.remove('gekozen');
 if(keuze === "true"){
   status.textContent = '✅ Je hebt toestemming gegeven voor analytische cookies.';
   btnJa.classList.add('gekozen');
 } else if(keuze === "false"){
   status.textContent = '❌ Je hebt analytische cookies geweigerd.';
   btnNee.classList.add('gekozen');
 } else {
   status.textContent = 'Je hebt nog geen keuze gemaakt voor dit account.';
 }
}

function setCookie(ja){
 if(!huidigGebruiker){ toonToast('⚠️ Log opnieuw in om je cookievoorkeur op te slaan.', true); return; }
 huidigGebruiker.cookieKeuze = ja ? "true" : "false"; // direct lokaal bijwerken voor snelle UI-respons
 updateCookieUI();
 google.script.run
   .withFailureHandler(err=>toonToast('⚠️ Opslaan mislukt: '+err.message, true))
   .slaCookieKeuzeOp(huidigGebruiker.user, huidigGebruiker.role, ja);
}

// ── Cookie-banner (linksonder, per account, alleen als nog geen keuze gemaakt) ──

function toonCookieBannerIndienNodig(){
 const banner=document.getElementById('cookie-banner');
 if(!huidigGebruiker){ banner.classList.remove('zichtbaar'); return; }
 const keuze = huidigGebruiker.cookieKeuze;
 if(keuze === "true" || keuze === "false"){
   banner.classList.remove('zichtbaar');
 } else {
   banner.classList.add('zichtbaar');
 }
}

function cookieBannerKeuze(ja){
 if(!huidigGebruiker) return;
 huidigGebruiker.cookieKeuze = ja ? "true" : "false";
 document.getElementById('cookie-banner').classList.remove('zichtbaar');
 toonToast(ja?'✅ Cookies geaccepteerd.':'Cookies geweigerd.');
 google.script.run
   .withFailureHandler(err=>toonToast('⚠️ Opslaan mislukt: '+err.message, true))
   .slaCookieKeuzeOp(huidigGebruiker.user, huidigGebruiker.role, ja);
}
